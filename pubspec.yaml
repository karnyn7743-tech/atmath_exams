name: atmath_exams
description: "تطبيق أتمتة الإختبارات - إعداد وتطوير أ. فواز سنان البعيثي"
publish_to: "none"

version: 1.0.4+6

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # حزم النظام والتخزين المحلي والصلاحيات واستقبال الملفات
  device_info_plus: ^10.1.0
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  better_download_saver: ^0.0.1
  receive_sharing_intent: ^1.8.0
  
  # حزم معالجة الوثائق والملفات والطباعة المباشرة
  pdf: ^3.12.0
  pdfx: ^2.6.0
  fluent_editor:
    git:
      url: https://github.com/exusr/fluent-editor.git
  printing: ^5.13.0
  archive: ^3.6.1
  path_provider: ^2.1.2
  file_picker: ^8.0.0
  image_picker: ^1.1.0
  excel: ^4.0.6
  xml: ^6.5.0
  open_filex: ^4.5.0
  barcode: ^2.2.8
  uuid: ^4.4.0
  
  # حزم الكاميرا ومعالجة الصور وقراءة الباركود و OCR
  camera: ^0.11.0+1
  image: ^4.2.0
  mobile_scanner: ^5.2.3
  google_mlkit_text_recognition: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
  
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf

    - family: Arial
      fonts:
        - asset: assets/fonts/Arial.ttf
          weight: 400
        - asset: assets/fonts/Arial-bold.ttf
          weight: 700
          
