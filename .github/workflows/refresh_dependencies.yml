name: Refresh Flutter Lockfile and Check Gradle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.50.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Resolve Dart and Flutter dependencies
        run: flutter pub get

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh pubspec lock"
            git push
          else
            echo "pubspec.lock is already up to date."
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate missing Gradle wrapper
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.3.1 --distribution-type all
          fi

      - name: Commit Gradle wrapper files
        run: |
          git add android/gradlew android/gradlew.bat android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.properties
          if ! git diff --staged --quiet; then
            git commit -m "build: add Gradle 9.3.1 wrapper"
            git push
          else
            echo "Gradle wrapper files are already present."
          fi

      - name: Verify Android Gradle configuration
        working-directory: android
        run: ./gradlew help --no-daemon
