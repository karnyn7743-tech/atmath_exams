org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false

# Match the validated AGP 9 setup used by the working exam_maker_app project.
android.newDsl=false
android.builtInKotlin=false

# إلغاء الحظر الصارم للـ Namespaces المتكررة في مكتبات ML/TFLite القديمة
android.disableMinifyLocalDependenciesForLibraries=true
android.experimental.r8.dex-shrunk-desugared-library=true
